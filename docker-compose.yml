version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres-container
    environment:
      POSTGRES_USER: DEFAULT_USER
      POSTGRES_PASSWORD: Example1001@
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql.conf:/usr/share/postgresql/postgresql.conf.sample
    command: ["postgres", "-c", "config_file=/usr/share/postgresql/postgresql.conf.sample"]

  backend:
    build:
      context: ./backend
    container_name: flask-container
    command: flask run --host=0.0.0.0
    environment:
      FLASK_APP: app.py
      FLASK_ENV: development
      DATABASE_URL: postgresql://DEFAULT_USER:Example1001%40@db:5432/postgres
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: react-container
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
